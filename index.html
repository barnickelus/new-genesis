<!DOCTYPE html>
<!--
================================================================================
  GENESIS — a living game of consumption and evolution
================================================================================
  The screen is a primordial field. Motes of matter drift across it. You TAP to
  send out a shockwave that consumes the matter it touches, growing your
  organism. Buy traits to feed automatically, fill the evolution meter, and
  transform — climbing from a spark of life to cosmic awakening.

  Built as one self-contained file: a fixed-timestep simulation, a particle
  system, and a thin DOM HUD that updates in place (no per-frame innerHTML).
================================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Genesis — A Story of Becoming</title>
<style>
  :root{
    --ink:#eaf0ff; --muted:#93a0d0; --gold:#ffd479; --good:#6ee7a8; --bad:#ff8094;
    --panel:rgba(12,16,32,.66); --edge:rgba(130,160,255,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; overflow:hidden; background:#04050b}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink); user-select:none; touch-action:none}
  canvas{position:fixed; inset:0; display:block}

  /* ---------- top HUD ---------- */
  #top{position:fixed; top:0; left:0; right:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; padding:10px 14px 0}
  #eraLine{font-size:12px; letter-spacing:4px; text-transform:uppercase; color:var(--era,#7cf0d0);
    text-shadow:0 0 14px var(--era,#7cf0d0); margin-bottom:2px}
  #biomass{font-size:clamp(30px,7vw,52px); font-weight:800; line-height:1; letter-spacing:1px;
    transition:transform .07s; text-shadow:0 0 26px rgba(124,240,208,.35)}
  #biomass.bump{transform:scale(1.09)}
  #sub{font-size:13px; color:var(--muted); margin-top:3px}
  #sub b{color:var(--era,#7cf0d0)}
  #combo{height:18px; margin-top:6px; font-size:13px; font-weight:700; color:var(--gold);
    opacity:0; transition:opacity .2s}
  #combo.on{opacity:1}

  /* evolution meter */
  #evoWrap{width:min(420px,86vw); margin-top:8px}
  #evoBar{height:7px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden}
  #evoFill{height:100%; width:0%; border-radius:5px;
    background:linear-gradient(90deg,var(--era,#7cf0d0),#b48cff); transition:width .2s}
  #evoTxt{font-size:11px; letter-spacing:1px; color:var(--muted); text-align:center; margin-top:3px}

  /* ---------- bottom dock ---------- */
  #dock{position:fixed; left:0; right:0; bottom:0; z-index:2;
    display:flex; gap:8px; justify-content:center; align-items:stretch;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); flex-wrap:wrap}
  .card{pointer-events:auto; min-width:120px; flex:0 1 150px; cursor:pointer;
    background:var(--panel); border:1px solid var(--edge); border-radius:13px; padding:9px 11px;
    backdrop-filter:blur(8px); transition:transform .08s, border-color .15s, opacity .15s}
  .card:hover{border-color:rgba(124,240,208,.55)}
  .card:active{transform:scale(.97)}
  .card.cant{opacity:.5}
  .card.cant:hover{border-color:var(--edge)}
  .card .h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .card .nm{font-size:13px; font-weight:700}
  .card .lv{font-size:12px; color:var(--gold); font-variant-numeric:tabular-nums}
  .card .ds{font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.3; min-height:26px}
  .card .ct{font-size:12px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums}
  .card .ct.ok{color:var(--good)} .card .ct.no{color:var(--bad)}

  #evolve{pointer-events:auto; cursor:pointer; flex:0 1 168px; min-width:140px;
    border:1px solid #b48cff; border-radius:13px; padding:9px 11px; backdrop-filter:blur(8px);
    background:linear-gradient(160deg,rgba(180,140,255,.28),rgba(124,240,208,.10));
    display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
    transition:transform .08s, filter .15s, opacity .2s; opacity:.45}
  #evolve.ready{opacity:1; animation:glow 1.6s ease-in-out infinite}
  #evolve.ready:hover{filter:brightness(1.12)}
  #evolve:active{transform:scale(.97)}
  #evolve .t{font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase}
  #evolve .s{font-size:10.5px; color:var(--muted); margin-top:2px}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(180,140,255,.0)}50%{box-shadow:0 0 22px 2px rgba(180,140,255,.55)}}

  /* ---------- corner controls ---------- */
  #ctrl{position:fixed; top:10px; right:12px; z-index:3; display:flex; gap:6px}
  #ctrl button{pointer-events:auto; background:var(--panel); border:1px solid var(--edge);
    color:var(--muted); font-size:11px; padding:6px 9px; border-radius:8px; cursor:pointer; backdrop-filter:blur(6px)}
  #ctrl button:hover{color:var(--ink); border-color:var(--era,#7cf0d0)}

  /* first-run hint */
  #hint{position:fixed; left:0; right:0; top:62%; z-index:1;
    pointer-events:none; font-size:15px; letter-spacing:2px; color:var(--ink); opacity:0;
    text-shadow:0 0 18px #000; transition:opacity .6s; text-align:center}
  #hint.show{opacity:.85}

  /* ---------- chapter banner ---------- */
  #banner{position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 42%,rgba(24,12,48,.5),rgba(2,3,9,.94)); backdrop-filter:blur(4px)}
  #banner.show{display:flex; animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #banner .card2{max-width:540px; text-align:center; padding:30px}
  #banner .e{font-size:12px; letter-spacing:6px; text-transform:uppercase; color:var(--era,#7cf0d0); margin-bottom:10px}
  #banner h2{font-size:clamp(24px,6vw,34px); margin:0 0 16px; letter-spacing:1px;
    background:linear-gradient(90deg,var(--era,#7cf0d0),#b48cff,var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  #banner p{font-size:15px; line-height:1.7; font-style:italic; color:var(--ink); margin:0 0 22px}
  #banner button{pointer-events:auto; padding:11px 28px; border:1px solid var(--era,#7cf0d0); background:transparent;
    color:var(--era,#7cf0d0); border-radius:10px; cursor:pointer; letter-spacing:3px; text-transform:uppercase; font-size:12px}
  #banner button:hover{background:rgba(124,240,208,.12)}

  #toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(14px); z-index:4;
    background:var(--panel); border:1px solid var(--edge); padding:9px 16px; border-radius:10px;
    font-size:13px; opacity:0; transition:.3s; pointer-events:none; backdrop-filter:blur(6px)}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="eraLine">Primordial Soup</div>
  <div id="biomass">0</div>
  <div id="sub"><b id="rate">0</b> /sec · <span id="bite">+1</span> per bite</div>
  <div id="combo">Combo ×1.0</div>
  <div id="evoWrap">
    <div id="evoBar"><div id="evoFill"></div></div>
    <div id="evoTxt">Evolution: 0%</div>
  </div>
</div>

<div id="ctrl">
  <button id="muteBtn">Sound: On</button>
  <button id="resetBtn">Reset</button>
</div>

<div id="hint">Tap the drifting matter to consume it</div>

<div id="dock"></div>

<div id="banner"><div class="card2">
  <div class="e" id="bnEra">Era</div>
  <h2 id="bnTitle">Title</h2>
  <p id="bnText">...</p>
  <button id="bnBtn">Continue</button>
</div></div>

<div id="toast"></div>

<script>
"use strict";
/* ============================================================================
   1. CONFIG — all tunables in one place
   ============================================================================ */
const CONFIG = {
  tickHz: 60,
  comboWindow: 1.5,      // seconds of inactivity before combo resets
  comboPerHit: 0.16,     // combo gained per mote consumed
  comboMax: 6,
  baseTapRadius: 70,     // shockwave reach at reach=0
  shockSpeed: 900,       // px/sec the consume ring expands
  shockLife: 0.34,       // seconds a shockwave stays active
  moteRadius: [7, 13],   // min,max
  organismBaseR: 44,
  maxParticles: 360,
  saveEveryMs: 12000,
};

/* ============================================================================
   2. ERAS — the narrative spine; each transforms the whole field
   ============================================================================ */
const ERAS = [
  { name:"Primordial Soup", era:"#5fd0ff", mote:"#7cf0d0", goal:80,
    title:"A Spark in the Void",
    text:"Matter drifts through an endless ocean, lifeless and indifferent — until something begins to consume. In the beginning there is only hunger." },
  { name:"First Cell", era:"#6ee7a8", mote:"#b6f0a4", goal:650,
    title:"The First Hunger",
    text:"Fragile and singular, the cell learns to feed. Every success is temporary, every meal a small victory against the dark. Yet life persists." },
  { name:"The Colony", era:"#9be36e", mote:"#d6f08c", goal:4800,
    title:"From Simplicity, Complexity",
    text:"Cells bind to cells, and the lonely speck becomes a coordinated whole — greater than the sum of its parts." },
  { name:"The Predator", era:"#ffcf5f", mote:"#ffdf8e", goal:33000,
    title:"Instinct Sharpens",
    text:"To consume is to thrive. Speed and hunger are written into flesh. Survival begins to give rise to ambition." },
  { name:"The Titan", era:"#ff9d5f", mote:"#ffc08e", goal:2.2e5,
    title:"Titans Walk",
    text:"The predator becomes a titan, reshaping the ecosystems it was born into. At the limit of strength, awareness flickers awake." },
  { name:"The Mind", era:"#ff7a90", mote:"#ffaab8", goal:1.4e6,
    title:"The Inner Light",
    text:"Instinct becomes awareness. The creature remembers, imagines, plans. Ambition gives rise to intelligence." },
  { name:"Civilization", era:"#b48cff", mote:"#d4bcff", goal:9.5e6,
    title:"No Creature Alone",
    text:"No creature conquers the universe alone. Tribes form, cities rise — the story of life becomes the story of civilization." },
  { name:"Cosmic Awakening", era:"#dfe9ff", mote:"#bcd8ff", goal:Infinity,
    title:"The Universe Awakening to Itself",
    text:"Worlds become seeds; galaxies become ecosystems. Evolution is the universe awakening to itself — and the story is yours to continue." },
];

/* ============================================================================
   3. TRAITS — repeatable upgrades bought with biomass
   ============================================================================ */
const TRAITS = [
  { id:"bite",  name:"Bigger Bite",  base:20, mult:1.18,
    desc:"Each mote you consume is worth more." },
  { id:"reach", name:"Wider Reach",  base:65, mult:1.20,
    desc:"Your consuming shockwave spreads farther." },
  { id:"cilia", name:"Cilia",        base:55, mult:1.19,
    desc:"Tendrils that feed on nearby matter automatically." },
  { id:"soup",  name:"Rich Soup",    base:90, mult:1.17,
    desc:"More matter drifts in, and it's richer." },
];

/* ============================================================================
   4. STATE
   ============================================================================ */
function freshState(){
  return {
    biomass: 0,          // spendable, resets each evolution
    eraGain: 0,          // earned this era (fills the evolution meter)
    lifetime: 0,         // all-time, never resets
    stage: 0,            // index into ERAS
    up: { bite:0, reach:0, cilia:0, soup:0 },
    muted: false,
    seen: 0,
  };
}
let S = load() || freshState();

// world entities (not saved)
let motes = [], particles = [], shocks = [], floats = [], tendrils = [];
let combo = 1, comboTimer = 0;
let spawnTimer = 0, autoTimer = 0, rateEMA = 0, gainAccum = 0, rateTimer = 0;
let W = 0, H = 0, time = 0, hintTimer = 4;

/* ============================================================================
   5. DERIVED VALUES (single source of truth for the economy)
   ============================================================================ */
const era      = () => ERAS[S.stage];
const globalMult = () => Math.pow(3, S.stage);
const biteValue  = () => (1 + S.up.bite) * globalMult();
const tapRadius  = () => CONFIG.baseTapRadius * (1 + S.up.reach * 0.13);
const autoRadius = () => 200 * (1 + S.up.reach * 0.10);
const spawnCap   = () => 16 + S.up.soup * 4;
const spawnEvery = () => Math.max(0.10, 0.55 / (1 + S.up.soup * 0.22));
const moteWorth  = () => 1 + S.up.soup * 0.5;          // base value of a mote (pre-bite)
const autoEvery  = () => Math.max(0.35, 1.6 / (1 + S.up.cilia * 0.12));
const traitCost  = t => Math.ceil(t.base * Math.pow(t.mult, S.up[t.id]) * (1 + S.stage * 0.6));
const evoGoal    = () => era().goal;
const evoProgress= () => Math.min(1, S.eraGain / evoGoal());
const canEvolve  = () => S.stage < ERAS.length - 1 && S.eraGain >= evoGoal();
const organismR  = () => CONFIG.organismBaseR + Math.log2(1 + S.eraGain) * 4 + S.stage * 3;

/* ============================================================================
   6. NUMBER FORMATTING
   ============================================================================ */
const UNITS = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n){
  if(n < 1000) return Number.isInteger(n) ? n.toString() : n.toFixed(n<10?1:0);
  let u = 0; while(n >= 1000 && u < UNITS.length-1){ n /= 1000; u++; }
  return n.toFixed(n<10?2:n<100?1:0) + UNITS[u];
}

/* ============================================================================
   7. INPUT — every tap fires a shockwave that consumes matter it sweeps over
   ============================================================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function tapAt(x, y){
  shocks.push({ x, y, r0:0, r:tapRadius()*0.35, max:tapRadius()*2.2, life:CONFIG.shockLife });
  // immediate bite at the tap point so a tap always feels responsive
  consumeWithin(x, y, tapRadius()*0.55, true);
  ripple(x, y);
}
canvas.addEventListener("pointerdown", e=>{
  unlockAudio();
  if(hintTimer > 0){ hintTimer = 0; document.getElementById("hint").classList.remove("show"); }
  tapAt(e.clientX, e.clientY);
});
addEventListener("keydown", e=>{
  if(e.code === "Space"){ e.preventDefault(); unlockAudio(); tapAt(W/2, H/2); }
});

/* ============================================================================
   8. CONSUMPTION
   ============================================================================ */
function consumeWithin(x, y, radius, byTap){
  let any = false;
  for(let i = motes.length - 1; i >= 0; i--){
    const m = motes[i];
    const dx = m.x - x, dy = m.y - y;
    if(dx*dx + dy*dy <= (radius + m.r) * (radius + m.r)){
      eat(m, byTap);
      motes.splice(i, 1);
      any = true;
    }
  }
  return any;
}
function eat(m, byTap){
  if(byTap){
    combo = Math.min(CONFIG.comboMax, combo + CONFIG.comboPerHit);
    comboTimer = CONFIG.comboWindow;
  }
  const gain = m.value * biteValue() * (byTap ? combo : 0.6);
  S.biomass  += gain;
  S.eraGain  += gain;
  S.lifetime += gain;
  gainAccum  += gain;
  burst(m.x, m.y, era().mote, byTap ? 9 : 5);
  floats.push({ x:m.x, y:m.y, vy:-34, life:0.9, txt:"+"+fmt(gain), c: byTap ? era().mote : "#cfd8ff" });
  bumpBiomass();
  sfx(byTap ? 420 + combo*70 : 300, byTap ? "triangle" : "sine", 0.05);
}

/* ============================================================================
   9. SIMULATION (fixed timestep)
   ============================================================================ */
function spawnMote(){
  const edge = Math.floor(Math.random()*4);
  const m = { r: rand(CONFIG.moteRadius[0], CONFIG.moteRadius[1]), value: moteWorth(), wob: Math.random()*6.28 };
  const speed = rand(14, 40);
  if(edge===0){ m.x=-20; m.y=Math.random()*H; m.vx=speed; m.vy=rand(-20,20); }
  else if(edge===1){ m.x=W+20; m.y=Math.random()*H; m.vx=-speed; m.vy=rand(-20,20); }
  else if(edge===2){ m.x=Math.random()*W; m.y=-20; m.vx=rand(-20,20); m.vy=speed; }
  else { m.x=Math.random()*W; m.y=H+20; m.vx=rand(-20,20); m.vy=-speed; }
  motes.push(m);
}

function update(dt){
  time += dt;

  // spawn matter up to the cap
  spawnTimer -= dt;
  if(spawnTimer <= 0 && motes.length < spawnCap()){ spawnMote(); spawnTimer = spawnEvery(); }

  // drift motes; gentle pull toward the organism so the field stays lively near center
  const cx = W/2, cy = H/2;
  for(let i = motes.length - 1; i >= 0; i--){
    const m = motes[i];
    m.wob += dt*2;
    const pdx = cx - m.x, pdy = cy - m.y, pd = Math.hypot(pdx, pdy) || 1;
    m.vx += (pdx/pd) * 6 * dt;
    m.vy += (pdy/pd) * 6 * dt;
    m.x += m.vx * dt; m.y += m.vy * dt;
    if(m.x < -60 || m.x > W+60 || m.y < -60 || m.y > H+60) motes.splice(i, 1);
  }

  // expand shockwaves; each consumes matter in the annulus it sweeps this frame
  for(let i = shocks.length - 1; i >= 0; i--){
    const s = shocks[i];
    s.r0 = s.r;
    s.r = Math.min(s.max, s.r + CONFIG.shockSpeed * dt);
    s.life -= dt;
    for(let j = motes.length - 1; j >= 0; j--){
      const m = motes[j], d = Math.hypot(m.x - s.x, m.y - s.y);
      if(d <= s.r + m.r && d >= s.r0 - m.r){ eat(m, true); motes.splice(j, 1); }
    }
    if(s.life <= 0) shocks.splice(i, 1);
  }

  // cilia: auto-feed on nearest motes
  if(S.up.cilia > 0){
    autoTimer -= dt;
    if(autoTimer <= 0){
      autoTimer = autoEvery();
      const reach = autoRadius();
      for(let k = 0; k < S.up.cilia; k++){
        let best = -1, bestD = reach*reach;
        for(let j = 0; j < motes.length; j++){
          const m = motes[j], dd = (m.x-cx)*(m.x-cx)+(m.y-cy)*(m.y-cy);
          if(dd < bestD){ bestD = dd; best = j; }
        }
        if(best >= 0){
          const m = motes[best];
          tendrils.push({ x:m.x, y:m.y, life:0.3 });
          eat(m, false);
          motes.splice(best, 1);
        }
      }
    }
  }

  // combo decay
  if(comboTimer > 0){ comboTimer -= dt; if(comboTimer <= 0) combo = 1; }

  // particles + floats + tendrils
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }
  for(let i = floats.length - 1; i >= 0; i--){
    const f = floats[i]; f.y += f.vy*dt; f.life -= dt; if(f.life <= 0) floats.splice(i, 1);
  }
  for(let i = tendrils.length - 1; i >= 0; i--){ tendrils[i].life -= dt; if(tendrils[i].life <= 0) tendrils.splice(i,1); }

  // income rate (EMA, refreshed twice a second)
  rateTimer += dt;
  if(rateTimer >= 0.5){
    const inst = gainAccum / rateTimer;
    rateEMA = rateEMA*0.6 + inst*0.4;
    gainAccum = 0; rateTimer = 0;
  }

  if(hintTimer > 0){ hintTimer -= dt; if(hintTimer <= 0) document.getElementById("hint").classList.remove("show"); }
}

/* ============================================================================
   10. RENDER
   ============================================================================ */
let dust = [];
function buildDust(){ dust = []; for(let i=0;i<120;i++) dust.push({x:Math.random(),y:Math.random(),z:Math.random()}); }

function render(){
  ctx.clearRect(0,0,W,H);
  const e = era(), cx = W/2, cy = H/2;

  // background nebula
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.75);
  bg.addColorStop(0, hexA(e.era, 0.10));
  bg.addColorStop(1, "rgba(4,5,11,1)");
  ctx.fillStyle = "#04050b"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // drifting dust
  for(const d of dust){
    const x = ((d.x + time*0.01*(0.3+d.z)) % 1) * W;
    const y = d.y * H;
    ctx.globalAlpha = 0.10 + d.z*0.35;
    ctx.fillStyle = d.z > 0.7 ? e.era : "#9fb0ff";
    ctx.fillRect(x, y, d.z*1.8+0.4, d.z*1.8+0.4);
  }
  ctx.globalAlpha = 1;

  // tendrils (auto-feed)
  for(const t of tendrils){
    ctx.globalAlpha = Math.max(0, t.life/0.3) * 0.7;
    ctx.strokeStyle = e.era; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(t.x, t.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // motes
  for(const m of motes){
    const pr = m.r + Math.sin(m.wob)*1.2;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, pr*2.4);
    g.addColorStop(0, hexA(e.mote, 0.95));
    g.addColorStop(0.5, hexA(e.mote, 0.4));
    g.addColorStop(1, hexA(e.mote, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, pr*2.4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(m.x, m.y, pr*0.5, 0, 6.2832); ctx.fill();
  }

  // shockwaves
  for(const s of shocks){
    ctx.globalAlpha = Math.max(0, s.life/CONFIG.shockLife) * 0.8;
    ctx.strokeStyle = e.era; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  drawOrganism(cx, cy, e);

  // particles
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floating numbers
  ctx.textAlign = "center"; ctx.font = "700 17px 'Segoe UI',sans-serif";
  for(const f of floats){
    ctx.globalAlpha = Math.max(0, f.life/0.9);
    ctx.fillStyle = f.c;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawOrganism(cx, cy, e){
  const R = organismR();
  const breathe = 1 + 0.05*Math.sin(time*1.6) + orgPulse*0.16;
  const lobes = 3 + S.stage;
  // aura
  const aura = ctx.createRadialGradient(cx, cy, R*0.3, cx, cy, R*2.3);
  aura.addColorStop(0, hexA(e.era, 0.45));
  aura.addColorStop(1, hexA(e.era, 0));
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(cx, cy, R*2.3, 0, 6.2832); ctx.fill();
  // wobbling body
  ctx.beginPath();
  const steps = 72;
  for(let i = 0; i <= steps; i++){
    const a = (i/steps)*6.2832;
    const wob = 1 + 0.10*Math.sin(a*lobes + time*1.4) + 0.05*Math.sin(a*(lobes+3) - time);
    const rr = R*breathe*wob;
    const x = cx + Math.cos(a)*rr, y = cy + Math.sin(a)*rr;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath();
  const body = ctx.createRadialGradient(cx-R*0.3, cy-R*0.3, R*0.1, cx, cy, R*1.3);
  body.addColorStop(0, "#ffffff");
  body.addColorStop(0.5, hexA(e.era, 0.85));
  body.addColorStop(1, hexA(e.era, 0.45));
  ctx.fillStyle = body; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = hexA(e.era, 0.9); ctx.stroke();
  // nucleus + organelles
  const nodes = Math.min(2 + S.stage, 10);
  for(let i = 0; i < nodes; i++){
    const a = time*0.6 + i*(6.2832/nodes), dist = R*0.5*(0.4 + 0.5*((i%3)/2));
    const x = cx + Math.cos(a)*dist, y = cy + Math.sin(a)*dist;
    ctx.fillStyle = "rgba(255,255,255," + (0.3 + 0.2*Math.sin(time*1.5+i)) + ")";
    ctx.beginPath(); ctx.arc(x, y, R*0.12, 0, 6.2832); ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath(); ctx.arc(cx, cy, R*0.2, 0, 6.2832); ctx.fill();
  if(orgPulse > 0) orgPulse = Math.max(0, orgPulse - 0.05);
}

/* ============================================================================
   11. FEEDBACK helpers (particles, ripples, bump, sound)
   ============================================================================ */
let orgPulse = 0;
function bumpBiomass(){ orgPulse = 1; }
function burst(x, y, color, n){
  for(let i = 0; i < n && particles.length < CONFIG.maxParticles; i++){
    const a = Math.random()*6.2832, sp = rand(40, 180);
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:rand(1.5,3.5), life:rand(0.3,0.7), max:0.7, c:color });
  }
}
function ripple(x, y){
  for(let i = 0; i < 6 && particles.length < CONFIG.maxParticles; i++){
    const a = (i/6)*6.2832;
    particles.push({ x, y, vx:Math.cos(a)*60, vy:Math.sin(a)*60, r:2, life:0.3, max:0.3, c:"#ffffff" });
  }
}
function rand(a, b){ return a + Math.random()*(b-a); }
function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ============================================================================
   12. HUD (built once, updated in place)
   ============================================================================ */
const dock = document.getElementById("dock");
const cards = {};
function buildDock(){
  dock.innerHTML = "";
  for(const t of TRAITS){
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="h"><span class="nm">${t.name}</span><span class="lv">Lv ${S.up[t.id]}</span></div>
      <div class="ds">${t.desc}</div><div class="ct"></div>`;
    el.addEventListener("click", ()=>buyTrait(t));
    dock.appendChild(el);
    cards[t.id] = { el, lv: el.querySelector(".lv"), ct: el.querySelector(".ct") };
  }
  const ev = document.createElement("div");
  ev.id = "evolve";
  ev.innerHTML = `<div class="t">Evolve</div><div class="s" id="evoSub">—</div>`;
  ev.addEventListener("click", doEvolve);
  dock.appendChild(ev);
  cards._evolve = ev;
}
function buyTrait(t){
  const cost = traitCost(t);
  if(S.biomass < cost) return;
  S.biomass -= cost; S.up[t.id]++;
  sfx(520, "triangle", 0.08);
  refreshHUD();
}
const $ = id => document.getElementById(id);
let lastBiomassText = "";
function refreshHUD(){
  document.documentElement.style.setProperty("--era", era().era);
  const bm = fmt(S.biomass);
  if(bm !== lastBiomassText){ $("biomass").textContent = bm; lastBiomassText = bm; }
  $("rate").textContent = fmt(Math.max(0, rateEMA));
  $("bite").textContent = "+" + fmt(biteValue());
  $("eraLine").textContent = era().name;
  // combo
  const cmb = $("combo");
  if(combo > 1.05){ cmb.classList.add("on"); cmb.textContent = "Combo ×" + combo.toFixed(1); }
  else cmb.classList.remove("on");
  // evolution meter
  const p = evoProgress();
  $("evoFill").style.width = (p*100).toFixed(1) + "%";
  $("evoTxt").textContent = S.stage < ERAS.length-1
    ? `Evolution: ${fmt(S.eraGain)} / ${fmt(evoGoal())} (${(p*100|0)}%)`
    : "Final form reached — endless growth";
  // trait costs
  for(const t of TRAITS){
    const cost = traitCost(t), ok = S.biomass >= cost, c = cards[t.id];
    c.lv.textContent = "Lv " + S.up[t.id];
    c.ct.textContent = fmt(cost);
    c.ct.className = "ct " + (ok ? "ok" : "no");
    c.el.classList.toggle("cant", !ok);
  }
  // evolve button
  const ready = canEvolve();
  cards._evolve.classList.toggle("ready", ready);
  $("evoSub").textContent = S.stage < ERAS.length-1
    ? (ready ? "→ " + ERAS[S.stage+1].name : "fill the meter")
    : "transcend (soon)";
}

/* ============================================================================
   13. EVOLUTION
   ============================================================================ */
function doEvolve(){
  if(!canEvolve()) return;
  S.stage++;
  S.biomass = 0; S.eraGain = 0;          // stored biomass is spent becoming; traits persist
  combo = 1;
  motes.length = 0; particles.length = 0;
  burstBig();
  showChapter(S.stage);
  sfx(180, "sine", 0.6); setTimeout(()=>sfx(720, "sine", 0.5), 120);
  buildDust();
  refreshHUD(); save();
}
function burstBig(){
  for(let i = 0; i < 80; i++){
    const a = Math.random()*6.2832, sp = rand(120, 480);
    particles.push({ x:W/2, y:H/2, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:rand(2,4), life:rand(0.6,1.2), max:1.2, c:era().era });
  }
}
function showChapter(i){
  const e = ERAS[i];
  $("bnEra").textContent = "Era " + i + " — " + e.name;
  $("bnTitle").textContent = e.title;
  $("bnText").textContent = e.text;
  $("banner").classList.add("show");
  S.seen = Math.max(S.seen, i);
}
$("bnBtn").addEventListener("click", ()=> $("banner").classList.remove("show"));

/* ============================================================================
   14. SOUND (WebAudio, no assets)
   ============================================================================ */
let AC = null;
function unlockAudio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); }
function sfx(freq, type, dur){
  if(S.muted || !AC) return;
  try{
    const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, freq*1.6), t0+dur);
    g.gain.setValueAtTime(0.06, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur);
  }catch(e){}
}

/* ============================================================================
   15. SAVE / LOAD
   ============================================================================ */
function save(){ try{ localStorage.setItem("genesis2", JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem("genesis2"); if(!raw) return null;
    const d = JSON.parse(raw), base = freshState();
    Object.assign(base, d);
    base.up = Object.assign(freshState().up, d.up || {});
    return base;
  }catch(e){ return null; }
}
$("muteBtn").addEventListener("click", ()=>{
  S.muted = !S.muted;
  $("muteBtn").textContent = "Sound: " + (S.muted ? "Off" : "On");
  unlockAudio(); if(!S.muted) sfx(440, "triangle", 0.08); save();
});
$("resetBtn").addEventListener("click", ()=>{
  if(confirm("Erase this lineage and begin again from the void?")){
    localStorage.removeItem("genesis2"); S = freshState();
    motes.length = particles.length = shocks.length = 0; combo = 1;
    buildDust(); refreshHUD(); toast("A new spark appears…");
  }
});
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.classList.remove("show"), 2200); }
setInterval(save, CONFIG.saveEveryMs);
addEventListener("beforeunload", save);

/* ============================================================================
   16. BOOT + main loop
   ============================================================================ */
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener("resize", resize);

let last = performance.now(), acc = 0, hudTimer = 0;
function frame(now){
  let dt = (now - last) / 1000; last = now;
  if(dt > 0.25) dt = 0.25;                  // clamp after tab-out
  acc += dt;
  const step = 1 / CONFIG.tickHz;
  while(acc >= step){ update(step); acc -= step; }
  render();
  hudTimer += dt;
  if(hudTimer >= 0.1){ refreshHUD(); hudTimer = 0; }   // HUD at ~10fps is plenty
  requestAnimationFrame(frame);
}

resize(); buildDust(); buildDock();
$("muteBtn").textContent = "Sound: " + (S.muted ? "Off" : "On");
refreshHUD();
if(S.lifetime === 0){ document.getElementById("hint").classList.add("show"); showChapter(0); }
else { S.seen = Math.max(S.seen, S.stage); }
requestAnimationFrame(frame);
</script>
